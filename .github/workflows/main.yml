name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Build Unsigned App (Release)
        run: |
          xcodebuild clean build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 3. Đóng gói thành file .ipa (Unsigned)
        run: |
          # Tạo thư mục Payload và copy file .app vào
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ThreeOneOSFive.app" "$RUNNER_TEMP/Payload/"
          
          # Nén thư mục Payload thành file .ipa
          cd "$RUNNER_TEMP"
          zip -qry "ThreeOneOSFive-unsigned.ipa" Payload

      - name: 4. Upload file IPA (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned-ipa
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error