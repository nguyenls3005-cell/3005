name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Build Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 3. Đóng gói thành file .ipa (Unsigned)
        run: |
          # Trích xuất file .app từ archive
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/ThreeOneOSFive.app" "$RUNNER_TEMP/Payload/"
          
          # Nén thành file .ipa
          cd "$RUNNER_TEMP"
          zip -qry "ThreeOneOSFive-unsigned.ipa" Payload

      - name: 4. Upload file IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-unsigned-ipa
          path: ${{ runner.temp }}/ThreeOneOSFive-unsigned.ipa
          if-no-files-found: error
